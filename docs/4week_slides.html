<h2 id="%EC%B6%94%EC%B2%9C-%EB%A1%9C%EC%A7%81-%EB%B0%A9%ED%96%A5">추천 로직 방향</h2>

<ul>
<li>배당주와 ETF는 데이터 성격이 달라 <strong>엔진을 분리</strong>
<ul>
<li>배당주: 배당률 API 제공 / ETF: 분배금 API 없음(SEIBro 수동조사)</li>
<li>ETF는 같은 지수를 여러 운용사가 추종 → 카테고리 단위로 처리</li>
</ul>
</li>
<li>두 엔진이 <strong>같은 스코어링 공식을 재사용</strong> (정규화 → 가중치 → 점수비례 비중)</li>
<li>성향검사 결과는 <strong>기본으로 보여줄 유형</strong>만 결정, 3유형 포트폴리오는 항상 조회 가능</li>
<li>사용자가 정한 **ETF:배당주 비율(10% 단위)**로 두 결과를 블렌딩 (사용자 선택)</li>
</ul>
</section>

<p>배당주와 ETF는 자산의 법적·구조적 성격 자체가 다름</p>
<table>
<thead>
<tr>
<th></th>
<th>배당주</th>
<th>ETF</th>
</tr>
</thead>
<tbody>
<tr>
<td>성격</td>
<td>개별 기업의 지분 증권</td>
<td>여러 종목을 담은 펀드(집합투자기구)</td>
</tr>
<tr>
<td>연동</td>
<td>기업 실적·재무상태에 직접 연동</td>
<td>지수·바스켓 단위로 분산</td>
</tr>
</tbody>
</table>
<p>→ 이 구조적 차이 때문에 <strong>데이터 출처와 계산 로직도 근본적으로 달라짐</strong></p>

<ul>
<li><strong>배당주</strong>: 배당률을 API(금융위원회_주식배당정보)가 직접 제공 → 계산 없이 캐싱</li>
<li><strong>ETF</strong>: 분배율 제공 API 없음 → 분배금(원화) 수동조사 후 연환산 계산 필요</li>
<li><strong>ETF</strong>: 같은 지수를 여러 운용사(KODEX/TIGER 등)가 내놓는 구조 → 카테고리 단위 계산 + 상품 나열이라는 별도 처리 필요</li>
</ul>
<p>결론</p>
<ul>

→ 비율로 합산해도 되고, 배당주만 / ETF만 단독으로 써도 됨</li>
</ul>

<ul>
<li>국내 ETF 시장은 삼성자산운용(KODEX)·미래에셋자산운용(TIGER)이 전체 순자산의 70% 이상 (2026년 상반기 기준)</li>
<li>지수추종은 상품 간 성과 차이가 거의 없음 → <strong>유동성(거래량)이 큰 쪽</strong>이 매매 편의상 유리</li>
<li>그래서 KODEX·TIGER 2개 운용사로 압축</li>
</ul>
<p><strong>지수 대상: S&amp;P500 · 나스닥100</strong></p>
<ul>
<li>코스피·코스닥 1배 지수추종은 분배수익률 각각 1.4~1.5%, 0.05~0.3% 수준으로 매력이 낮고</li>
<li>미국 지수 대비 변동성도 높다고 평가되어 제외</li>
</ul>
</section>

<h2 id="2-1-%EC%A0%95%EA%B7%9C%ED%99%94-26%EA%B0%9C-%EC%A0%84%EC%97%AD-min-max">2-1. 정규화 (26개 전역 min-max)</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>안정성점수 = 100 - (변동성 - 전역최소변동성)
                   / (전역최대변동성 - 전역최소변동성) × 100

수익성점수 = (배당률 - 전역최소배당률)
                   / (전역최대배당률 - 전역최소배당률) × 100
</code></pre>
<ul>
<li>그룹A 12 + 그룹B 14, <strong>26개 후보군 내 상대 위치(0~100)</strong></li>
<li>절대 수치 자체엔 의미 없음</li>
<li>후보군 값이 전부 같으면(max = min) <strong>50점 고정</strong></li>
</ul>
</section>

<h2 id="2-2-%EC%A2%85%ED%95%A9%EC%A0%90%EC%88%98%EC%99%80-%EA%B0%80%EC%A4%91%EC%B9%98">2-2. 종합점수와 가중치</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>종합점수 = 안정성점수 × stabilityWeight + 수익성점수 × profitWeight
</code></pre>
<table>
<thead>
<tr>
<th>유형</th>
<th>안정성</th>
<th>수익성</th>
</tr>
</thead>
<tbody>
<tr>
<td>원금집중형</td>
<td>0.7</td>
<td>0.3</td>
</tr>
<tr>
<td>균형형</td>
<td>0.5</td>
<td>0.5</td>
</tr>
<tr>
<td>배당집중형</td>
<td>0.3</td>
<td>0.7</td>
</tr>
</tbody>
</table>
<ul>
<li>0.2 간격 3분할 → 유형 간 결과 차이가 뚜렷하게 나오도록 설계</li>
<li>사용자 자율 가중치는 <strong>채택 안 함</strong> (편의 저해, 극단적 비중 방어)</li>
<li>현재는 임시값 → 실데이터에서 차이가 뚜렷하지 않으면 조정 가능</li>
</ul>
<p>정렬(동점 처리): 종합점수 ↓ → 배당률 ↓ → 종목ID ↑</p>
</section>

<h2 id="3-2-%EC%8A%A4%EC%BD%94%EC%96%B4%EB%A7%81">3-2. 스코어링</h2>
<p><strong>LISTED — 스코어링 없음</strong></p>
<ul>
<li>같은 지수를 따라가는 패시브 상품 → 점수로 우열을 가릴 실익 없음</li>
<li>카테고리 안 상품은 <strong>균등분배</strong></li>
</ul>
<p><strong>SINGLE — 배당주와 같은 공식 재사용</strong></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>안정성점수 = 100 - (변동성 - 최소) / (최대 - 최소) × 100
수익성점수 = (배당률 - 최소) / (최대 - 최소) × 100
종합점수   = 안정성 × stabilityWeight + 수익성 × profitWeight
</code></pre>
<ul>
<li>정규화는 <strong>SINGLE 10개 풀 안에서만</strong> (LISTED와 분리)</li>
<li>가중치·정렬 규칙은 배당주와 동일</li>
</ul>
</section>

<h2 id="3-3-%EB%B9%84%EC%A4%91%EA%B3%BC-%EC%84%A0%EC%A0%95-%EA%B0%9C%EC%88%98">3-3. 비중과 선정 개수</h2>
<table>
<thead>
<tr>
<th>유형</th>
<th>LISTED : SINGLE</th>
<th>SINGLE 개수</th>
<th>총 카테고리</th>
<th>목표 분배율</th>
</tr>
</thead>
<tbody>
<tr>
<td>원금집중형</td>
<td>70 : 30</td>
<td>2~3</td>
<td>5~6</td>
<td>2 ~ 5%</td>
</tr>
<tr>
<td>균형형</td>
<td>50 : 50</td>
<td>3~4</td>
<td>6~7</td>
<td>5 ~ 8%</td>
</tr>
<tr>
<td>배당집중형</td>
<td>30 : 70</td>
<td>4~5</td>
<td>7~8</td>
<td>8 ~ 15%</td>
</tr>
</tbody>
</table>
<ul>
<li>LISTED 3개는 탐색 대상이 아니라 <strong>항상 고정</strong></li>
<li>SINGLE 개수 범위 안에서 <strong>penalty 최소</strong> 개수 채택 (공식은 배당주와 동일)</li>
<li>배당집중형일수록 SINGLE 개수를 늘림 → <strong>큰 비중이 소수 카테고리에 몰리는 위험 완화</strong></li>
</ul>
</section>

<pre is="marp-pre" data-auto-scaling="downscale-only"><code>[LISTED] 카테고리당 비중 = 유형별 LISTED 비중(%) ÷ 3
