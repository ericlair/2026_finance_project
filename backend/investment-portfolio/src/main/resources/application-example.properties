spring.application.name=investment-portfolio
spring.datasource.url=jdbc:mysql://localhost:3306/investment_portfolio?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.username=<DB 사용자>
spring.datasource.password=${DB_PASSWORD}
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=validate
publicdata.api.service-key=${PUBLICDATA_SERVICE_KEY}
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
app.frontend-url=http://localhost:5173
app.scheduler.enabled=false